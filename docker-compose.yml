services:
  mongo:
    image: mongo:7
    container_name: invorra-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - invorra_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  nats:
    image: nats:2.11-alpine
    container_name: invorra-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/invorra?replicaSet=rs0&directConnection=true
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      FORECAST_PROVIDER: ${FORECAST_PROVIDER:-python}
      ML_SERVICE_URL: http://ml:8000
      NATS_URL: nats://nats:4222
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  ml:
    profiles: ["full"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invorra_mongo_data:
