services:
  postgres:
    image: postgres:16-alpine
    container_name: invorra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invorra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invorra}
      POSTGRES_DB: ${POSTGRES_DB:-invorra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invorra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invorra} -d ${POSTGRES_DB:-invorra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    container_name: invorra-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invorra}:${POSTGRES_PASSWORD:-invorra}@postgres:5432/${POSTGRES_DB:-invorra}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      FORECAST_PROVIDER: ${FORECAST_PROVIDER:-python}
      ML_SERVICE_URL: http://ml:8000
      NATS_URL: nats://nats:4222
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  ml:
    profiles: ["full"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invorra_pg_data:
